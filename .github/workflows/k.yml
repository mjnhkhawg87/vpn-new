name: iPA NmkiOSVN Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Runestone submodule manually
        run: |
          git clone https://github.com/nekohasekai/Runestone.git \
            SingBoxEngine/Frameworks/Runestone

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
          sudo xcode-select -s /Applications/$XCODE/Contents/Developer
          echo "Using: $XCODE"
          swift --version

      - name: Fix Script Permissions & Hardcoded Path
        run: |
          chmod -R +x scripts/ 2>/dev/null || true
          find . -name "project.pbxproj" -exec sed -i '' 's|/scripts/package_lemon_data.sh|./scripts/package_lemon_data.sh|g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's|SRCROOT/scripts|${SRCROOT}/scripts|g' {} +

      - name: Build SingBoxEngine (Library.framework via SFI)
        run: |
          set -o pipefail

          xcodebuild -project "SingBoxEngine/sing-box.xcodeproj" \
                     -scheme "SFI" \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     -jobs 2 \
                     -quiet \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Build Xcode Project
        run: |
          set -o pipefail

          SCHEME=$(xcodebuild -list -project "ThreeOneOSFive.xcodeproj" | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | head -n 1 | xargs)

          if [ -z "$SCHEME" ]; then
            SCHEME="NmkiOSVN"
          fi

          echo "==> Selected Scheme: '$SCHEME'"

          xcodebuild -project "ThreeOneOSFive.xcodeproj" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     -jobs 2 \
                     -quiet \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package .app into FFH4X-v1.0.1-unsigned.ipa
        run: |
          mkdir -p build/ipa/Payload

          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          cp -r "$APP_PATH" build/ipa/Payload/NmkiOSVN.app

          cd build/ipa
          zip -r ../FFH4X-v1.0.1-unsigned.ipa Payload
          cd ../..

          echo "==> Đã đóng gói thành công: build/FFH4X-v1.0.1-unsigned.ipa"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FFH4X-v1.0.1-unsigned
          path: build/FFH4X-v1.0.1-unsigned.ipa
