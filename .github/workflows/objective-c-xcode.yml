name: Build Library.framework

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Runestone
        run: |
          git clone https://github.com/nekohasekai/Runestone.git \
            SingBoxEngine/Frameworks/Runestone

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
          sudo xcode-select -s /Applications/$XCODE/Contents/Developer
          echo "Using: $XCODE"

      - name: Build Library.framework
        run: |
          set -o pipefail
          xcodebuild -project "SingBoxEngine/sing-box.xcodeproj" \
                     -scheme "SFI" \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     -jobs 2 \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Copy & Commit Library.framework to repo
        run: |
          mkdir -p SingBoxEngine/prebuilt
          cp -r build/Build/Products/Release-iphoneos/Library.framework \
            SingBoxEngine/prebuilt/Library.framework

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add SingBoxEngine/prebuilt/Library.framework
          git commit -m "Add prebuilt Library.framework"
          git push
