name: Build Libbox Framework

on:
  workflow_dispatch:

jobs:
  build-framework:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Gomobile & Build Libbox.xcframework
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          
          # Clone mã nguồn sing-box
          git clone https://github.com/SagerNet/sing-box.git singbox-src
          cd singbox-src

          # Thêm dependency x/mobile để sửa lỗi gomobile bind
          go get golang.org/x/mobile@latest
          
          # Đảm bảo tạo sẵn thư mục chứa framework
          mkdir -p ../SingBoxEngine

          # Build framework vào đúng đường dẫn SingBoxEngine/
          gomobile bind -v -target=ios,iossimulator -iosversion=15.0 -o ../SingBoxEngine/Libbox.xcframework ./experimental/libbox
          cd ..

      - name: Verify Framework Structure
        run: |
          if [ -d "SingBoxEngine/Libbox.xcframework" ]; then
            echo "SUCCESS: Libbox.xcframework đã được tạo tại SingBoxEngine/"
          else
            echo "ERROR: Không tìm thấy Libbox.xcframework!" && exit 1
          fi

      - name: Upload Libbox Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Libbox.xcframework
          path: SingBoxEngine/Libbox.xcframework
